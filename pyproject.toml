[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collab-a2a"
version = "1.29.0"
description = "An A2A hub that lets coding agents on different machines talk, align on tasks, and discuss work in real time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "a2a-sdk[fastapi]>=1.1.2",
    "uvicorn>=0.30",
    "httpx>=0.28.1",
    "httpx-sse>=0.4",
    # fastapi and starlette both require >=0.0.18 for the form parser this
    # app's file upload goes through; nothing else in the chain pins it.
    "python-multipart>=0.0.18",
    # client/bridge.py imports websockets.asyncio.server, which does not exist
    # before 13.0 and is the default implementation from 14.0.
    "websockets>=14",
    # `zoneinfo` reads the system tzdata, and Windows ships none — without this
    # `collab config timezone Europe/Madrid` would refuse every zone name there
    # while working everywhere else. It is the standard fallback wheel and the
    # marker keeps it off machines that already have a tz database.
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
collab = "collab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The agent skills ship with the package so `collab skills install` works from
# an installed copy, not only from a checkout.
[tool.setuptools.package-data]
collab = ["skills/**/*.md", "rules/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
